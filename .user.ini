; Raises PHP's upload limits to match this app's own caps (5MB per file,
; 20MB total across all documents in config.php). Without this, PHP's
; typical shared-hosting defaults (often 2M/8M) silently reject uploads
; before our own validation ever sees them.
upload_max_filesize = 8M
post_max_size = 25M
max_file_uploads = 20
